name: Check Starlark with sty
description: Build the pinned sty revision and check a Bazel workspace's implementations and stubs.

inputs:
  files:
    description: Additional implementation files or directories, newline-separated and relative to working-directory.
    default: ''
  advisory-files-from:
    description: Optional file listing workspace-relative files to check for an advisory report.
    default: ''
  advisory-only:
    description: Run only the advisory inventory in a workspace without a strict selection.
    default: 'false'
  working-directory:
    description: Bazel workspace containing sty.toml.
    default: .
  bazel-version:
    description: Bazel version for the checked workspace; defaults to its .bazelversion.
    default: ''
  code-flow-analysis:
    description: Report possibly unbound names and unreachable code.
    default: 'true'
  audit-loads:
    description: Resolve every transitive load and check load cycles.
    default: 'false'
  artifact-name:
    description: Name of the artifact containing build logs, diagnostics, and the coverage report.
    default: sty

runs:
  using: composite
  steps:
    - name: Prepare reports
      id: reports
      shell: bash
      env:
        # Nested actions replace github.action_ref when evaluating their inputs.
        STY_REVISION: ${{ github.action_ref }}
      run: |
        directory=$(mktemp -d "$RUNNER_TEMP/sty.XXXXXX")
        echo "directory=$directory" >> "$GITHUB_OUTPUT"
        echo "revision=$STY_REVISION" >> "$GITHUB_OUTPUT"

    - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
      with:
        bazelisk-version: 1.29.0
        bazelisk-cache: true
        module-root: ${{ inputs.working-directory }}
        # The pinned action revision covers checker inputs; setup-bazel hashes
        # the consumer's manifests within GITHUB_WORKSPACE.
        cache-version: sty-${{ steps.reports.outputs.revision }}
        disk-cache: true
        repository-cache: true
        cache-save: ${{ github.event_name != 'pull_request' }}

    - name: Build sty
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        REPORT_DIRECTORY: ${{ steps.reports.outputs.directory }}
      run: |
        export USE_BAZEL_VERSION
        USE_BAZEL_VERSION=$(cat .bazelversion)
        bazel build -c opt --lockfile_mode=error //:sty 2>&1 | tee "$REPORT_DIRECTORY/build.log"
        # The following check uses the consumer's workspace and Bazel version.
        # Keep the binary outside the build output base before that switch.
        cp "$(bazel info -c opt bazel-bin)/crates/starpls/sty" "$REPORT_DIRECTORY/sty"

    - name: Check implementations and stubs
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REPORT_DIRECTORY: ${{ steps.reports.outputs.directory }}
        CHECK_FILES: ${{ inputs.files }}
        ADVISORY_ONLY: ${{ inputs.advisory-only }}
        ADVISORY_FILES_FROM: ${{ inputs.advisory-files-from }}
        CHECK_BAZEL_VERSION: ${{ inputs.bazel-version }}
        CODE_FLOW_ANALYSIS: ${{ inputs.code-flow-analysis }}
        AUDIT_LOADS: ${{ inputs.audit-loads }}
      run: |
        if [[ -n "$CHECK_BAZEL_VERSION" ]]; then
          export USE_BAZEL_VERSION="$CHECK_BAZEL_VERSION"
        else
          unset USE_BAZEL_VERSION
        fi
        options=(--check-local-interface-sources --experimental_infer_ctx_attributes)
        case "$CODE_FLOW_ANALYSIS" in
          true) options+=(--experimental_use_code_flow_analysis) ;;
          false) ;;
          *) echo 'code-flow-analysis must be true or false.' >&2; exit 1 ;;
        esac
        case "$AUDIT_LOADS" in
          true) options+=(--audit-loads) ;;
          false) ;;
          *) echo 'audit-loads must be true or false.' >&2; exit 1 ;;
        esac
        strict_status=0
        case "$ADVISORY_ONLY" in
          true)
            if [[ -z "$ADVISORY_FILES_FROM" || -n "$CHECK_FILES" ]]; then
              echo 'advisory-only requires advisory-files-from and cannot be combined with files.' >&2
              exit 1
            fi
            ;;
          false)
            printf '%s\n' "$CHECK_FILES" > "$REPORT_DIRECTORY/files.txt"
            "$REPORT_DIRECTORY/sty" check "${options[@]}" \
              --files-from "$REPORT_DIRECTORY/files.txt" \
              --progress --report "$REPORT_DIRECTORY/coverage.json" \
              2>&1 | tee "$REPORT_DIRECTORY/diagnostics.log" || strict_status=$?
            ;;
          *) echo 'advisory-only must be true or false.' >&2; exit 1 ;;
        esac
        if [[ -n "$ADVISORY_FILES_FROM" ]]; then
          advisory="$REPORT_DIRECTORY/advisory"
          mkdir "$advisory"
          cp -- "$ADVISORY_FILES_FROM" "$advisory/files.txt"
          "$REPORT_DIRECTORY/sty" check "${options[@]}" --exit-zero \
            --files-from "$advisory/files.txt" --output-format json-lines \
            --report "$advisory/coverage.json" > "$advisory/diagnostics.jsonl"
          python3 "$GITHUB_ACTION_PATH/action/advisory_summary.py" "$advisory" | tee -a "$GITHUB_STEP_SUMMARY"
        fi
        exit "$strict_status"

    - name: Upload sty reports
      if: ${{ always() && steps.reports.outputs.directory != '' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ steps.reports.outputs.directory }}/*.log
          ${{ steps.reports.outputs.directory }}/*.json
          ${{ steps.reports.outputs.directory }}/files.txt
          ${{ steps.reports.outputs.directory }}/advisory/
        if-no-files-found: warn
        retention-days: 14
